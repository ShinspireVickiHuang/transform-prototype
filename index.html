<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找數位轉型｜SENSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
html,body,#root{height:100%;margin:0}
body{font-family:'Noto Sans TC','DM Sans',system-ui,sans-serif;color:#323232;background:#FAFCFF;font-size:14px;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font-family:inherit}
#root{display:flex}
.inp{width:100%;height:34px;padding:0 12px;font-size:14px;border:1px solid #E3E3E3;background:#fff;color:#323232;border-radius:4px;outline:none;font-family:inherit}
textarea.inp{height:auto;padding:8px 12px;line-height:1.6;resize:vertical}
.inp:focus{border-color:#49BFBB;background:#F5FFFF}
.inp.bad{border-color:#FF4D4F}
.lbl{font-size:13px;color:#323232;font-weight:500;margin-bottom:4px;display:block}
.page{padding:24px;max-width:1200px;margin:0 auto;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.trial-grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.rrow{display:grid;grid-template-columns:130px minmax(0,1.2fr) minmax(0,1.6fr) 120px 110px 150px;gap:12px;align-items:center;padding:12px 16px}
.rhead{font-size:12px;color:#999;background:#FAFAFA;border-bottom:1px solid #EBEEF5}
.rbody{border-bottom:1px solid #F1F3F6;cursor:pointer;font-size:13px}
.rbody:hover{background:#F7FFFF}
.hov:hover{border-color:#49BFBB !important;box-shadow:0 6px 16px rgba(35,55,128,.10) !important}
.navit:hover{background:#FAFAFA}
.steps{display:flex;gap:8px;margin-bottom:16px}
@media (max-width:899px){
  .page{padding:16px}
  .three,.two,.kpis,.fields,.fields3{grid-template-columns:minmax(0,1fr)}
  .trial-grid{grid-template-columns:minmax(0,1fr)}
  .rhead{display:none}
  .rrow{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px}
  .rrow > *:nth-child(3){grid-column:1 / -1}
  .steps{overflow:hidden}
  .orow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
  .orow > *:nth-child(2){order:-1;flex:1 1 100%}
}
@media print{aside,header,.noprint{display:none !important}}
</style>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ============================================================
   共用資料物件：題目、試算假設、24 個情境、示範評估紀錄
   所有頁面都從 DM 讀取，不各自造資料
   ============================================================ */
const fmt = (n, d) => Number(n).toLocaleString('zh-TW', { maximumFractionDigits: d || 0, minimumFractionDigits: d || 0 });
const num = (x) => { const v = parseFloat(x); return isFinite(v) && v >= 0 ? v : 0; };
const pct = (c) => fmt(c * 100) + '%';

const DM = {};
DM.BASE = { workDays: 240, dayHours: 8 };
DM.HIGH = 300;
DM.INDUSTRIES = ['資訊服務業', '製造業', '零售／電商', '金融／保險', '不動產／建設', '服務業', '專業服務（顧問、會計、法律）', '其他'];
DM.SYSTEMS = [['erp', 'ERP'], ['acct', '會計系統'], ['pos', 'POS／電商平台'], ['crm', 'CRM 客戶管理'], ['cms', '官網後台'], ['eip', '內部入口／公文系統'], ['excel', '主要靠 Excel'], ['other', '其他'], ['none', '都沒有']];
DM.CLOUD = [['yes', '可以'], ['part', '部分可以，敏感資料要留在公司內'], ['no', '不行，全部要留在公司內']];
DM.SCATTER = [['one', '集中在一套系統'], ['some', '分散在兩三套系統'], ['many', '分散在多套系統和個人 Excel']];
DM.BUDGETS = ['尚未決定', '50 萬以下', '50–150 萬', '150–300 萬', '300 萬以上'];
DM.WANT_TIMES = ['3 個月內', '3–6 個月', '6–12 個月', '尚未決定'];
DM.ROLES = [['all', '全體員工平均'], ['mkt', '行銷人員'], ['sales', '業務／主管'], ['cs', '客服人員'], ['admin', '財務／行政人員']];
DM.STATUS = {
  done: { label: '評估完成', color: 'default' },

  proposal: { label: '有方案待您確認', color: 'warning' },

  advisor: { label: '顧問聯繫中', color: 'brand' }
};
DM.STAGES = ['done', 'seeking', 'proposal', 'scheduled'];
DM.DEPTS = ['行銷', '業務', '客服', '財務', '人資', '採購', '行政與 IT', '管理層'];
DM.TYPES = ['AI', '自動化', '系統導入'];
DM.REFS = [
  '企業平均使用 897 套應用程式，只有 29% 有串接（MuleSoft Connectivity Benchmark 2025，1,050 位 IT 主管）',
  '81% 行銷人員要靠工程師修改網站，將近一半說改一次要好幾天（ButterCMS 2025，CMS 廠商調查）'
];

// 8 項試算項目：自評與試算共用同一份假設
// calc 回傳每年省下的小時數（已含改善幅度）；diff 為導入難度 1–3；needData 表示需要客戶資料整合為前提
DM.ITEMS = [
  { id: 'cms', role: 'mkt', group: 'ai', name: 'AI 內容助理', title: '網站內容要常常更新',
    desc: '活動、商品、公告等內容，每次要寫文案、改網頁', tdesc: 'AI 協助撰寫、改寫網站內容，行銷人員自己上線，不必等工程師',
    why: 'AI 協助撰寫、改寫內容，行銷人員自己上線，不必等工程師', diff: 1, cut: 40, cutLabel: '撰寫與上稿時間減少',
    fields: [{ k: 'n', l: '每月更新幾次', d: 20, s: 1 }, { k: 'h', l: '每次撰寫與上稿（小時）', d: 2, s: 0.5 }],
    calc: (v, c) => v.n * v.h * 12 * c,
    how: (v, c) => `${fmt(v.n)} 次 × ${fmt(v.h, 1)} 小時 × 12 個月 × 減少 ${pct(c)}` },

    calc: (v, c) => v.n * v.m / 60 * 12 * c,
    how: (v, c) => `${fmt(v.n)} 筆 × ${fmt(v.m, 1)} 分鐘 × 12 個月 × 減少 ${pct(c)}` },
  { id: 'journey', role: 'mkt', group: 'auto', name: '行銷自動化旅程', title: '行銷活動要人工分眾、一波一波發送',
    desc: '例如會員生日禮、新品通知、久未回購提醒，每次要撈名單、設定發送', tdesc: '依客戶行為自動分眾、自動發送，不必每波人工撈名單',
    why: '依客戶行為自動觸發，名單與發送時機由系統處理，行銷人員專心規劃活動內容', diff: 2, needData: true, cut: 70, cutLabel: '人工分眾與設定時間減少',
    fields: [{ k: 'n', l: '每月發送幾波', d: 8, s: 1 }, { k: 'h', l: '每波人工分眾與設定（小時）', d: 3, s: 0.5 }],

    why: '自動彙整客戶互動與消費紀錄，產出分析摘要給業務與主管', diff: 2, needData: true, cut: 60, cutLabel: '報表整理時間減少',

    calc: (v, c) => v.n * v.m / 60 * 12 * c,
    how: (v, c) => `${fmt(v.n)} 則 × ${fmt(v.m)} 分鐘 × 12 個月 × AI 回覆 ${pct(c)}` },
  { id: 'ocr', role: 'admin', group: 'ai', name: 'AI 單據辨識（OCR）', title: '發票、收據、訂單要人工登打',
    desc: '紙本或 PDF 單據，再打進會計或 ERP', tdesc: '發票、收據、訂單自動辨識，人工只需核對',

    calc: (v, c) => v.n * v.m / 60 * 12 * c,
    how: (v, c) => `${fmt(v.n)} 張 × ${fmt(v.m, 1)} 分鐘 × 12 個月 × 減少 ${pct(c)}（保留人工核對）` },
  { id: 'ipaas', role: 'admin', group: 'auto', name: 'iPaaS 自動化串接', title: '同一筆資料要在不同系統重複輸入',

    fields: [{ k: 'staff', l: '員工人數', d: 100, s: 1, trialOnly: true }, { k: 'm', l: '每人每天找資料（分鐘）', d: 30, s: 5 }],

    how: (v, c, D) => `${fmt(v.staff)} 人 × ${fmt(v.m)} 分鐘 × 減少 ${pct(c)} × ${fmt(D.workDays)} 天` }
];
DM.TRIAL_ORDER = ['ipaas', 'journey', 'cms', 'eip', 'ocr', 'cs', 'tag', 'insight'];
DM.item = (id) => DM.ITEMS.find((x) => x.id === id);

// 24 個情境（代碼、客戶的情況、解決方式）；item 為對應的試算項目，沒有則納入顧問評估
DM.SCENARIOS = [

  { code: 'MKT-03', dept: '行銷', type: '自動化', title: '行銷活動人工分眾、逐波發送', sol: '行銷自動化旅程', item: 'journey' },
  { code: 'MKT-04', dept: '行銷', type: '系統導入', title: '集點、優惠券、生日禮靠人工發放', sol: '電子集點與優惠券',
    note: '會員的集點、優惠券與生日禮由人工記錄與發放，容易漏發或重複發。', sdesc: '以電子集點卡與優惠券取代人工發放，可串接 LINE 通知會員。' },
  { code: 'MKT-05', dept: '行銷', type: '系統導入', title: '社團、公會的會員活動報名、報到靠人工', sol: '社群會員互動平台',
    note: '活動報名名單與現場報到都靠人工整理，事後也難彙整出席紀錄。', sdesc: '線上活動報名、QR Code 報到，並建立會員之間可查詢的人脈索引。' },

/* ============================================================
   算式：報告分析（自評與紀錄詳情共用）
   ============================================================ */
function analyze(A) {
  const staff = num(A.staff), sys = A.sys || [];
  const dataWeak = (A.scatter === 'many' || A.scatter === 'some' || sys.indexOf('crm') < 0);
  const items = [];
  DM.ITEMS.forEach((p) => {
    if (!A.on[p.id]) return;
    const v = {};
    p.fields.forEach((f) => { v[f.k] = f.trialOnly ? staff : num(A.v[p.id + '.' + f.k]); });
    const h = p.calc(v, p.cut / 100, DM.BASE);
    const diff = Math.min(p.diff + (p.needData && dataWeak ? 1 : 0), 3);
    items.push({ p, h, diff, pre: !!(p.needData && dataWeak) });
  });
  const total = items.reduce((s, i) => s + i.h, 0);
  let money = 0, priced = 0;
  items.forEach((i) => { const c = num(A.cost[i.p.role]) || num(A.cost.all); if (c > 0) { money += i.h / (DM.BASE.workDays * DM.BASE.dayHours) * c; priced++; } });
  const ranked = items.slice().sort((x, y) => y.h / y.diff - x.h / x.diff);
  const top = ranked.filter((i) => i.h >= 50).slice(0, 3);
  const Q = { go: [], plan: [], easy: [], hold: [] };
  items.forEach((i) => { const hi = i.h >= DM.HIGH, easy = i.diff <= 1; (hi && easy ? Q.go : hi ? Q.plan : easy ? Q.easy : Q.hold).push(i); });
  const p1 = [], p2 = [], p3 = [];
  if (items.some((i) => i.pre)) p1.push('先建立客戶資料基礎：整合各管道客戶資料' + (sys.indexOf('crm') < 0 ? '，搭配 CRM' : ''));
  const pre = p1.length > 0;
  top.forEach((i) => p1.push(i.p.name));
  items.forEach((i) => { if (p1.indexOf(i.p.name) < 0 && Q.hold.indexOf(i) < 0) p2.push(i.p.name); });
  Q.hold.forEach((i) => { if (p1.indexOf(i.p.name) < 0) p3.push(i.p.name); });
  // 導入準備度
  let score = 0; const tips = [];
  const real = sys.filter((x) => x !== 'none' && x !== 'excel');
  if (real.length) score += 25;
  else if (sys.indexOf('excel') >= 0) tips.push('主要作業還在 Excel，建議先把核心流程放進系統，AI 與自動化才有資料可用。');
  else tips.push('目前沒有使用系統，建議先把核心流程放進系統，AI 與自動化才有資料可用。');
  if (sys.indexOf('erp') >= 0 || sys.indexOf('crm') >= 0 || sys.indexOf('acct') >= 0) score += 25;
  else tips.push('尚未有 ERP、CRM 或會計系統，串接與分析的效益會受限。');
  if (A.cloud === 'yes') score += 25;
  else if (A.cloud === 'part') { score += 20; tips.push('敏感資料可留在公司內部，採地端與雲端混合部署。'); }
  else if (A.cloud === 'no') { score += 15; tips.push('資料需全部留在公司內部，可採地端部署，導入時程會較長。'); }
  else tips.push('尚未確認資料能否上雲，這會影響部署方式。');
  if (A.scatter === 'one') score += 25;
  else if (A.scatter === 'some') { score += 15; tips.push('客戶資料分散在兩三套系統，建議先整合，客情分析與自動貼標的效果才會出來。'); }
  else if (A.scatter === 'many') { score += 5; tips.push('客戶資料分散在多套系統與個人 Excel，整合客戶資料是第一步。'); }
  else tips.push('尚未確認客戶資料的存放狀況。');
  const level = score >= 80 ? '基礎完善，可以直接從優先項目開始導入' : score >= 55 ? '具備基本條件，部分項目需要先打基礎' : '建議先完成資料與系統基礎，再導入 AI';
  if (!tips.length) tips.push('系統與資料條件都已具備。');
  const title = (A.industry ? A.industry + '・' : '') + (staff ? staff + ' 人規模・' : '') + 'AI 與自動化機會點';
  return { items, total, fte: total / (DM.BASE.workDays * DM.BASE.dayHours), money, priced, top, Q, p1, p2, p3, pre, score, level, tips, title };
}

function missingOf(A) {
  const out = [];
  DM.ITEMS.forEach((p, i) => {
    if (!A.on[p.id]) return;
    const noNum = p.fields.filter((f) => !f.trialOnly).some((f) => !(num(A.v[p.id + '.' + f.k]) > 0));

  return out;
}

const STEP_NAMES = ['基本資料', '目前的系統', '工作現況', '預算與換算基準'];

function AssessPage({ A, setA, step, setStep, onGenerate, go }) {
  const [msg, setMsg] = useState('');
  const [errIds, setErrIds] = useState([]);
  const set = (patch) => setA({ ...A, ...patch });
  const toggleSys = (val) => {
    let s = A.sys.slice();
    if (s.indexOf(val) >= 0) s = s.filter((x) => x !== val);
    else { s.push(val); if (val === 'none') s = ['none']; else s = s.filter((x) => x !== 'none'); }
    set({ sys: s });
  };
  const setOn = (id, on) => set({ on: { ...A.on, [id]: on } });
  const setV = (key, val) => set({ v: { ...A.v, [key]: val } });
  const next = () => { setMsg(''); setStep(Math.min(4, step + 1)); window.scrollTo(0, 0); };
  const prev = () => { setMsg(''); setStep(Math.max(1, step - 1)); };
  const generate = () => {
    if (!DM.ITEMS.some((p) => A.on[p.id])) { setMsg('請在「工作現況」至少勾選一項。'); setStep(3); return; }
    const miss = missingOf(A);
    setErrIds(miss.map((m) => m.id));
    if (miss.length) { setMsg('以下勾選的項目還沒填數字，請先補上：' + miss.map((m) => m.text).join('、')); setStep(3); return; }
    setMsg(''); onGenerate();
  };
  return (
    <div className="page" style={{ maxWidth: 900 }}>
      <PageHead title="機會點自評" sub="回答 17 個關於貴公司現況的問題，約 10–15 分鐘。完成後會產生評估報告：哪些工作最值得先交給 AI 與自動化、每年可省下多少工時，以及建議的導入順序。"
        right={<>
          <Button variant="default" size="sm" onClick={() => { setA(DM.sampleAnswers()); setErrIds([]); setMsg('已載入 100 人資訊服務業的範例數字，可直接產生報告或修改。'); }}>載入範例</Button>
          <Button variant="default" size="sm" onClick={() => { setA(DM.blankAnswers()); setErrIds([]); setMsg(''); setStep(1); }}>清除重填</Button>
        </>} />
      <div className="steps">
        {STEP_NAMES.map((n, i) => {
          const on = step === i + 1, done = step > i + 1;
          return (
            <div key={n} onClick={() => setStep(i + 1)} style={{ flex: 1, minWidth: 0, cursor: 'pointer', borderBottom: '3px solid ' + (on || done ? TX : '#E3E3E3'), paddingBottom: 8 }}>
              <div style={{ fontSize: 12, color: on ? TX : '#999', fontFamily: 'DM Sans', fontWeight: 600 }}>STEP {i + 1}</div>
              <div style={{ fontSize: 13, color: on ? '#323232' : '#606266', fontWeight: on ? 500 : 400, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{n}</div>
            </div>
          );
        })}
      </div>
      <Card>
        {step === 1 && (
          <div style={{ display: 'grid', gap: 18 }}>
            <div><label className="lbl" htmlFor="q1">Q1　貴公司的產業</label><Select id="q1" value={A.industry} onChange={(v) => set({ industry: v })} options={DM.INDUSTRIES} /></div>
            <div><label className="lbl" htmlFor="q2">Q2　員工人數</label><NumInput id="q2" step={1} value={A.staff} onChange={(v) => set({ staff: v })} placeholder="例：100" /></div>
          </div>
        )}
        {step === 2 && (
          <div style={{ display: 'grid', gap: 18 }}>
            <div>
              <div className="lbl">Q3　目前有在用的系統<span style={{ color: '#999', fontWeight: 400, marginLeft: 6 }}>可複選</span></div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                {DM.SYSTEMS.map(([val, l]) => {
                  const on = A.sys.indexOf(val) >= 0;
                  return (
                    <label key={val} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '6px 12px', border: '1px solid ' + (on ? TEAL : '#E3E3E3'), background: on ? '#EDFFFF' : '#fff', color: on ? '#22736F' : '#323232', borderRadius: 16, fontSize: 13, cursor: 'pointer' }}>
                      <input type="checkbox" checked={on} onChange={() => toggleSys(val)} style={{ accentColor: TEAL, margin: 0 }} />{l}
                    </label>
                  );
                })}
              </div>
              {A.sys.indexOf('other') >= 0 && <div style={{ marginTop: 10 }}><label className="lbl">其他系統名稱（可填多個，每行一個）</label><textarea className="inp" rows={3} value={A.sysOther} onChange={(e) => set({ sysOther: e.target.value })} placeholder={'例：\n自行開發的訂單系統\n人資薪資系統'} /></div>}
            </div>
            <div><label className="lbl" htmlFor="q4">Q4　公司資料可以放在雲端嗎？</label><Select id="q4" value={A.cloud} onChange={(v) => set({ cloud: v })} options={DM.CLOUD} /></div>
            <div><label className="lbl" htmlFor="q5">Q5　客戶資料目前在哪裡？</label><Select id="q5" value={A.scatter} onChange={(v) => set({ scatter: v })} options={DM.SCATTER} /></div>
          </div>
        )}
        {step === 3 && (
          <div style={{ display: 'grid', gap: 12 }}>
            <div style={{ fontSize: 13, color: '#606266' }}>勾選貴公司有的情況，再填大概的數字。不確定時用估計值即可。</div>
            {DM.ITEMS.map((p, i) => {
              const on = !!A.on[p.id], bad = errIds.indexOf(p.id) >= 0 && on;
              return (
                <div key={p.id} id={'pain-' + p.id} style={{ border: '1px solid ' + (bad ? '#FF4D4F' : on ? TEAL : '#EBEEF5'), background: on ? '#FAFFFF' : '#fff', borderRadius: 6, padding: 14 }}>
                  <label style={{ display: 'flex', gap: 10, alignItems: 'flex-start', cursor: 'pointer' }}>
                    <input type="checkbox" checked={on} onChange={(e) => setOn(p.id, e.target.checked)} style={{ accentColor: TEAL, width: 16, height: 16, marginTop: 2, flexShrink: 0 }} />
                    <span><b style={{ fontWeight: 500 }}>Q{6 + i}　{p.title}</b><br /><span style={{ fontSize: 12.5, color: '#606266' }}>{p.desc}</span></span>
                  </label>
                  {on && (
                    <div className="fields" style={{ marginTop: 12, paddingLeft: 26 }}>
                      {p.fields.filter((f) => !f.trialOnly).map((f) => (
                        <div key={f.k}><label className="lbl" style={{ fontWeight: 400, color: '#606266' }}>{f.l}</label>
                          <NumInput bad={bad && !(num(A.v[p.id + '.' + f.k]) > 0)} step={f.s} value={A.v[p.id + '.' + f.k]} onChange={(v) => setV(p.id + '.' + f.k, v)} placeholder={'例：' + f.d} /></div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
            <div><label className="lbl" htmlFor="q14">Q14　還有其他想交給 AI 或自動化處理的工作嗎？<span style={{ color: '#999', fontWeight: 400, marginLeft: 6 }}>選填</span></label>
              <textarea id="q14" className="inp" rows={3} value={A.extra} onChange={(e) => set({ extra: e.target.value })} placeholder="例：每月要人工核對供應商報價、每週要整理會議紀錄" /></div>
          </div>
        )}
        {step === 4 && (
          <div style={{ display: 'grid', gap: 18 }}>
            <div className="fields">
              <div><label className="lbl" htmlFor="q15">Q15　年度預算區間（新台幣）<span style={{ color: '#999', fontWeight: 400, marginLeft: 6 }}>選填</span></label><Select id="q15" value={A.budget || ''} onChange={(v) => set({ budget: v })} options={DM.BUDGETS} /><div style={{ fontSize: 12, color: '#999', marginTop: 4 }}>選填，用於媒合合適方案，不會公開。</div></div>
              <div><label className="lbl" htmlFor="q16">Q16　期望導入時程<span style={{ color: '#999', fontWeight: 400, marginLeft: 6 }}>選填</span></label><Select id="q16" value={A.timeline || ''} onChange={(v) => set({ timeline: v })} options={DM.WANT_TIMES} /><div style={{ fontSize: 12, color: '#999', marginTop: 4 }}>選填，用於媒合合適方案，不會公開。</div></div>
            </div>
            <div>
              <div className="lbl">Q17　各職能平均每人年薪成本<span style={{ color: '#999', fontWeight: 400, marginLeft: 6 }}>元，含勞健保，選填；未填的職能以「全體員工平均」計算</span></div>
              <div className="fields3" style={{ marginTop: 8 }}>
                {DM.ROLES.map(([k, l]) => (
                  <div key={k}><label className="lbl" style={{ fontWeight: 400, color: '#606266' }}>{l}</label>
                    <NumInput step={10000} value={A.cost[k]} onChange={(v) => set({ cost: { ...A.cost, [k]: v } })} placeholder="未填" /></div>
                ))}
              </div>
            </div>
            <details>
              <summary style={{ cursor: 'pointer', fontSize: 13, color: '#606266' }}>試算採用的假設</summary>
              <p style={{ fontSize: 12.5, color: '#606266', lineHeight: 1.8, margin: '10px 0 0' }}>每年 240 個工作天、每天 8 小時。各項改善幅度採保守值，已保留人工確認與例外處理的時間：{DM.ITEMS.map((p) => p.name.replace('（OCR）', '') + ' ' + p.cut + '%').join('、')}。</p>
            </details>
            <label style={{ display: 'flex', gap: 10, alignItems: 'flex-start', cursor: 'pointer', padding: 14, background: '#F7FAFC', borderRadius: 6, fontSize: 13.5, lineHeight: 1.6 }}>
              <input type="checkbox" checked={A.consent} onChange={(e) => set({ consent: e.target.checked })} style={{ accentColor: TEAL, width: 16, height: 16, marginTop: 3, flexShrink: 0 }} />
              <span>同意平台以不具名方式，為我尋找合適的解決方案<span style={{ color: '#999', marginLeft: 6 }}>選填</span><br /><span style={{ fontSize: 12, color: '#999' }}>不會提供公司名稱與聯絡資料，有合適的方案時會先通知您，由您決定是否洽談。</span></span>
            </label>
          </div>
        )}
        {msg && <div role="alert" style={{ marginTop: 16, fontSize: 13, color: /^已載入/.test(msg) ? '#22736F' : '#D4380D', lineHeight: 1.7 }}>{msg}</div>}
        <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, marginTop: 22, paddingTop: 16, borderTop: '1px solid #F1F3F6', flexWrap: 'wrap' }}>
          <Button variant="default" onClick={step === 1 ? () => go('tx-home') : prev}>{step === 1 ? '取消' : '上一步'}</Button>
          {step < 4 ? <Button onClick={next}>下一步</Button> : <Button onClick={generate}>產生評估報告</Button>}
        </div>
      </Card>
    </div>
  );
}

function Stepper({ status, base }) {
  const idx = DM.STAGES.indexOf(status === 'advisor' ? (base || 'done') : status);
  return (
    <div style={{ display: 'flex', gap: 4, overflow: 'hidden' }}>
      {DM.STAGES.map((s, i) => (
        <div key={s} style={{ flex: 1, minWidth: 0 }}>
          <div style={{ height: 4, borderRadius: 2, background: i <= idx ? TX : '#E3E3E3' }} />
          <div style={{ fontSize: 11.5, marginTop: 6, color: i === idx ? '#323232' : '#999', fontWeight: i === idx ? 500 : 400 }}>{DM.STATUS[s].label}</div>
        </div>
      ))}
    </div>
  );
}

      <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', marginBottom: 6 }}>

        <StatusTag s={rec.status} />
      </div>
      <h3 style={{ margin: '0 0 16px', fontSize: 24, fontWeight: 500 }}>{an.title}{rec.scope ? '（評估範圍：' + rec.scope + '）' : ''}</h3>

        <div style={{ fontSize: 13, color: '#606266', marginBottom: 10 }}>目前進度</div>

        {rec.status === 'advisor' && <div style={{ marginTop: 12, fontSize: 13, color: '#22736F' }}>您已送出聯繫需求，顧問將於 2 個工作天內聯繫{rec.contact ? '（聯絡人：' + rec.contact.name + '，方便時段：' + rec.contact.slot + '）' : ''}。</div>}
        {rec.status === 'seeking' && <div style={{ marginTop: 12, fontSize: 13, color: '#606266' }}>平台正以不具名方式為您尋找合適的解決方案，有結果會在這裡通知您。</div>}
        {rec.status === 'scheduled' && <div style={{ marginTop: 12, fontSize: 13, color: '#3F9A14' }}>已安排洽談，顧問會與您確認時間。</div>}

        <Card><div style={{ fontSize: 12, color: '#999' }}>約等於</div><div style={{ fontSize: 30, fontFamily: 'DM Sans', fontWeight: 700, color: TX, lineHeight: 1.3 }}>{fmt(an.fte, 1)}</div><div style={{ fontSize: 12, color: '#606266' }}>個全職人力（每人每年 1,920 小時）</div></Card>
        <Card><div style={{ fontSize: 12, color: '#999' }}>換算金額</div><div style={{ fontSize: 30, fontFamily: 'DM Sans', fontWeight: 700, color: TX, lineHeight: 1.3 }}>{an.priced ? fmt(an.money / 10000) + ' 萬' : '—'}</div>

          <div style={{ background: '#F7FAFC', borderRadius: 6, padding: 14 }}><b style={{ fontWeight: 500 }}>現場診斷</b><p style={{ margin: '6px 0 0', fontSize: 13, color: '#606266', lineHeight: 1.7 }}>顧問到貴公司現場，跟著實際作業量測耗時、盤點系統與資料，產出流程地圖、實測效益與分階段導入藍圖。</p></div>

          <Button variant="default" onClick={() => window.print()}>列印或存成 PDF</Button>
          <Button variant="default" onClick={onRedo}>回到問卷修改</Button>
        </div>
      </>)}

      <div style={{ fontSize: 12, color: '#999', lineHeight: 1.8 }}>
        <div>本報告依您填入的數字與保守假設估算，實際效益會依導入範圍與作業流程而不同。AI 處理的項目都保留人工確認，關鍵判斷仍由貴公司同仁決定。</div>
        <div style={{ marginTop: 6 }}>參考數據：</div>{DM.REFS.map((r) => <div key={r}>{r}</div>)}
      </div>
    </div>
  );

        <div style={{ position: 'relative', flex: '1 1 240px', maxWidth: 420 }}>

const daysLeft = (o) => Math.ceil((o.deadline - Date.now()) / 86400000);
const isOverdue = (o) => o.stage === 'pushed' && daysLeft(o) <= 0;
const inboxGroup = (o) => isOverdue(o) ? '已逾期' : o.stage === 'pushed' ? '待回覆' : o.stage === 'declined' ? '已回覆・沒興趣' : '已回覆・有興趣';
function OStatusTag({ s }) { const x = DM.OSTATUS[s]; return <Tag color={x.color}>{x.label}</Tag>; }
function GroupTag({ o }) { const g = inboxGroup(o); return <Tag color={g === '已逾期' ? 'error' : g === '待回覆' ? 'warning' : g === '已回覆・有興趣' ? 'success' : 'default'}>{g}</Tag>; }
function Deadline({ o }) {
  if (o.stage !== 'pushed') return <span style={{ color: '#999' }}>已回覆</span>;
  const d = daysLeft(o);
  return <span style={{ color: d <= 2 ? '#D4380D' : '#606266', fontWeight: d <= 2 ? 500 : 400 }}>{d > 0 ? '剩 ' + d + ' 天' : '已逾期'}</span>;
}

function OppStepper({ stage }) {
  const idx = DM.OPP_FLOW.indexOf(stage);

  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
      {steps.map(([k, l], i) => {
        const on = i <= idx + 1 && stage !== 'rejected', cur = i === idx + 1;
        return <span key={k} style={{ fontSize: 12, padding: '3px 10px', borderRadius: 12, border: '1px solid ' + (on ? TX : '#E3E3E3'), background: cur ? TX : on ? '#E6F4F8' : '#fff', color: cur ? '#fff' : on ? TX : '#999', fontWeight: cur ? 500 : 400 }}>{l}</span>;
      })}
    </div>
  );
}

  const deals = opps.filter((o) => o.stage !== 'pushed' && o.stage !== 'declined');
  const list = deals.filter((o) => (st === '全部' || o.stage === st) && (!q.trim() || (o.id + DM.scn(o.code).title + (o.reveal ? o.reveal.company : '')).toLowerCase().indexOf(q.trim().toLowerCase()) >= 0));
  const stages = ['confirming', 'agreed', 'negotiating', 'proposing', 'won', 'closed', 'rejected'];
  return (
    <div className="page">
      <PageHead title="我的商機" sub="您回覆有興趣的機會與目前進度。客戶同意後會顯示客戶資訊，之後的階段由您更新。" />
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 12 }}>
        {['全部', ...stages].map((k) => <Chip key={k} label={k === '全部' ? '全部' : DM.OSTATUS[k].label} active={st === k} onClick={() => setSt(k)} />)}
      </div>
      <div style={{ position: 'relative', maxWidth: 420, marginBottom: 12 }}>
        <Icon name="search" size={16} style={{ position: 'absolute', left: 10, top: 9, color: '#999' }} />
        <input className="inp" style={{ paddingLeft: 32 }} aria-label="搜尋商機" placeholder="搜尋編號、情境或客戶" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>
      <Card padding={0} style={{ overflow: 'hidden' }}>
        <div className="rrow rhead"><span>編號</span><span>情境</span><span>客戶</span><span>預估效益</span><span>更新日期</span><span>進度</span></div>
        {list.length ? list.map((o) => (
          <div key={o.id} className="rrow rbody orow" role="button" onClick={() => onOpen(o.id)}>
            <span style={{ fontFamily: 'DM Sans', color: '#606266', whiteSpace: 'nowrap' }}>{o.id}</span>
            <span style={{ minWidth: 0 }}><b style={{ fontWeight: 500 }}>{DM.scn(o.code).title}</b><br /><span style={{ fontSize: 12, color: '#999' }}>{DM.scn(o.code).sol}</span></span>
            <span style={{ color: o.reveal ? '#323232' : '#999', minWidth: 0 }}>{o.reveal ? o.reveal.company : '尚未揭露'}</span>
            <span style={{ fontWeight: 500 }}>{o.benefit.replace('每年 ', '')}</span>
            <span style={{ color: '#999' }}>{o.updated}</span>
            <span><OStatusTag s={o.stage} /></span>
          </div>
        )) : <div style={{ padding: 40, textAlign: 'center', color: '#999' }}>沒有符合條件的商機<div style={{ marginTop: 12 }}><Button variant="secondary" onClick={() => { setSt('全部'); setQ(''); }}>清除篩選</Button></div></div>}
      </Card>
    </div>
  );
}

function CheckGroup({ options, value, onChange }) {
  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
      {options.map((v) => {
        const on = value.indexOf(v) >= 0;
        return (
          <label key={v} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '6px 12px', border: '1px solid ' + (on ? TEAL : '#E3E3E3'), background: on ? '#EDFFFF' : '#fff', color: on ? '#22736F' : '#323232', borderRadius: 16, fontSize: 13, cursor: 'pointer' }}>
            <input type="checkbox" checked={on} onChange={() => onChange(on ? value.filter((x) => x !== v) : [...value, v])} style={{ accentColor: TEAL, margin: 0 }} />{v}
          </label>
        );
      })}
    </div>
  );
}
function ProfilePage({ profile, setProfile }) {
  const [P, setP] = useState(profile); const [nc, setNc] = useState({ title: '', industry: '', code: '', note: '' }); const [adding, setAdding] = useState(false); const [err, setErr] = useState('');
  const sec = (t, children, sub) => <Card style={{ marginBottom: 16 }}><div style={{ fontSize: 15, fontWeight: 500 }}>{t}</div>{sub && <div style={{ fontSize: 12.5, color: '#999', marginTop: 4 }}>{sub}</div>}<div style={{ marginTop: 12 }}>{children}</div></Card>;
  const addCase = () => {
    if (!nc.title.trim() || !nc.industry || !nc.code) { setErr('請填寫案例名稱、產業與對應情境。'); return; }
    setP({ ...P, cases: [...P.cases, { ...nc, title: nc.title.trim(), note: nc.note.trim() }] }); setNc({ title: '', industry: '', code: '', note: '' }); setAdding(false); setErr(''); toast('已加入案例，記得按「儲存」');
  };
  return (
    <div className="page" style={{ maxWidth: 960 }}>
      <PageHead title="服務能力檔案" sub="平台依這些資料推薦機會，資料越完整越精準。" right={<><Button variant="default" onClick={() => { setP(profile); toast('已還原為上次儲存的內容'); }}>還原</Button><Button onClick={() => { setProfile(P); toast('能力檔案已儲存'); }}>儲存</Button></>} />
      {sec('可服務的情境', <>
        {DM.DEPTS.map((d) => { const ls = DM.SCENARIOS.filter((s) => s.dept === d); return (
          <div key={d} style={{ marginBottom: 12 }}><div style={{ fontSize: 12, color: '#999', marginBottom: 6 }}>{d}</div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>{ls.map((s) => { const on = P.codes.indexOf(s.code) >= 0; return (
              <label key={s.code} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '6px 12px', border: '1px solid ' + (on ? TEAL : '#E3E3E3'), background: on ? '#EDFFFF' : '#fff', borderRadius: 16, fontSize: 13, cursor: 'pointer' }}>
                <input type="checkbox" checked={on} onChange={() => setP({ ...P, codes: on ? P.codes.filter((x) => x !== s.code) : [...P.codes, s.code] })} style={{ accentColor: TEAL, margin: 0 }} />{s.sol}
              </label>); })}</div></div>); })}
      </>, '已勾選 ' + P.codes.length + ' 個情境，平台會依這些情境推薦機會')}
      <div className="two">
        {sec('擅長產業', <CheckGroup options={DM.INDUSTRIES} value={P.industries} onChange={(v) => setP({ ...P, industries: v })} />)}
        {sec('服務規模', <CheckGroup options={DM.SIZES} value={P.sizes} onChange={(v) => setP({ ...P, sizes: v })} />)}
        {sec('服務國家', <CheckGroup options={DM.COUNTRIES} value={P.countries} onChange={(v) => setP({ ...P, countries: v })} />)}
        {sec('部署方式', <CheckGroup options={DM.DEPLOYS} value={P.deploy} onChange={(v) => setP({ ...P, deploy: v })} />)}
        {sec('服務語言', <CheckGroup options={DM.LANGS} value={P.langs} onChange={(v) => setP({ ...P, langs: v })} />)}
        {sec('價格帶', <Select value={P.price} onChange={(v) => setP({ ...P, price: v })} options={DM.PRICES} />, '單案常見的費用範圍')}
      </div>
      {sec('案例', <>
        {P.cases.length ? P.cases.map((c, i) => (
          <div key={i} style={{ display: 'flex', gap: 12, padding: '10px 0', borderBottom: '1px solid #F1F3F6', alignItems: 'flex-start' }}>
            <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontWeight: 500, fontSize: 14 }}>{c.title}</div><div style={{ fontSize: 12, color: '#999', margin: '2px 0' }}>{c.industry}・{DM.scn(c.code).sol}</div><div style={{ fontSize: 13, color: '#606266', lineHeight: 1.7 }}>{c.note}</div></div>
            <Button variant="text" size="sm" onClick={() => setP({ ...P, cases: P.cases.filter((_, j) => j !== i) })}>移除</Button>
          </div>
        )) : <div style={{ color: '#999', fontSize: 13 }}>還沒有案例。</div>}
        {adding ? (
          <div style={{ marginTop: 14, padding: 14, background: '#F7FAFC', borderRadius: 6, display: 'grid', gap: 12 }}>
            <div><label className="lbl">案例名稱</label><input className="inp" value={nc.title} onChange={(e) => setNc({ ...nc, title: e.target.value })} placeholder="例：連鎖通路單據自動辨識" /></div>
            <div className="fields">
              <div><label className="lbl">產業</label><Select value={nc.industry} onChange={(v) => setNc({ ...nc, industry: v })} options={DM.INDUSTRIES} /></div>
              <div><label className="lbl">對應情境</label><Select value={nc.code} onChange={(v) => setNc({ ...nc, code: v })} options={DM.SCENARIOS.map((s) => [s.code, s.sol])} /></div>
            </div>
            <div><label className="lbl">說明</label><textarea className="inp" rows={3} value={nc.note} onChange={(e) => setNc({ ...nc, note: e.target.value })} placeholder="做了什麼、結果如何" /></div>
            {err && <div style={{ fontSize: 12.5, color: '#D4380D' }}>{err}</div>}
            <div style={{ display: 'flex', gap: 8 }}><Button onClick={addCase}>加入案例</Button><Button variant="default" onClick={() => { setAdding(false); setErr(''); }}>取消</Button></div>
          </div>
        ) : <div style={{ marginTop: 14 }}><Button variant="secondary" onClick={() => setAdding(true)}>新增案例</Button></div>}
      </>)}
    </div>
  );
}

function StatsPage({ opps, onOpen }) {
  const recv = opps.length, replied = opps.filter((o) => o.stage !== 'pushed').length;
  const interested = opps.filter((o) => ['pushed', 'declined'].indexOf(o.stage) < 0).length;
  const won = opps.filter((o) => o.stage === 'won' || o.settle);
  const k = (l, v, sub) => <Card><div style={{ fontSize: 12, color: '#999' }}>{l}</div><div style={{ fontSize: 30, fontFamily: 'DM Sans', fontWeight: 700, color: TX, lineHeight: 1.3 }}>{v}</div>{sub && <div style={{ fontSize: 12, color: '#606266' }}>{sub}</div>}</Card>;
  return (
    <div className="page">
      <PageHead title="成效與結算" sub="收到的機會、回覆情況與成交案的結算進度。" />
      <div className="cards" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(min(200px,100%),1fr))', marginBottom: 24 }}>
        {k('收到機會數', recv, '累計')}{k('回覆率', recv ? fmt(replied / recv * 100) + '%' : '—', replied + ' / ' + recv + ' 筆已回覆')}{k('有興趣數', interested)}{k('成交數', won.length)}
      </div>
      <div style={{ fontSize: 16, fontWeight: 500, marginBottom: 10 }}>結算列表</div>
      <Card padding={0} style={{ overflow: 'hidden' }}>
        <div className="rrow rhead"><span>編號</span><span>情境</span><span>客戶</span><span>預估效益</span><span>成交日期</span><span>結算狀態</span></div>
        {won.length ? won.map((o) => (
          <div key={o.id} className="rrow rbody orow" role="button" onClick={() => onOpen(o.id)}>
            <span style={{ fontFamily: 'DM Sans', color: '#606266', whiteSpace: 'nowrap' }}>{o.id}</span>
            <span style={{ minWidth: 0 }}><b style={{ fontWeight: 500 }}>{DM.scn(o.code).title}</b></span>
            <span style={{ minWidth: 0 }}>{o.reveal ? o.reveal.company : '—'}</span>
            <span style={{ fontWeight: 500 }}>{o.benefit.replace('每年 ', '')}</span>
            <span style={{ color: '#999' }}>{o.wonDate || '—'}</span>
            <span><Tag color={o.settle === 'settled' ? 'success' : 'warning'}>{o.settle === 'settled' ? '已結算' : '待結算'}</Tag></span>
          </div>
        )) : <div style={{ padding: 40, textAlign: 'center', color: '#999' }}>還沒有成交案</div>}
      </Card>
    </div>
  );
}

/* ============================================================
   App
   ============================================================ */
const STORE_KEY = 'tx-proto-v2';
function loadStore() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); if (s && s.records && s.draft && s.trial && s.opps && s.profile) return s; } catch (e) {}
  return { records: DM.demoRecords(), draft: DM.blankAnswers(), trial: DM.trialDefaults(), opps: DM.seedOpps(), profile: DM.seedProfile() };
}
function useMobile() {
  const [m, setM] = useState(() => window.matchMedia('(max-width: 899px)').matches);
  useEffect(() => { const mq = window.matchMedia('(max-width: 899px)'); const h = () => setM(mq.matches); mq.addEventListener('change', h); return () => mq.removeEventListener('change', h); }, []);
  return m;
}

function App() {
  const init = useMemo(loadStore, []);
  const [records, setRecords] = useState(init.records);
  const [draft, setDraft] = useState(init.draft);
  const [trial, setTrial] = useState(init.trial);
  const [opps, setOpps] = useState(init.opps);
  const [profile, setProfile] = useState(init.profile);
  const [demoOpen, setDemoOpen] = useState(false);
  const [oppId, setOppId] = useState(null);
  const [oppFrom, setOppFrom] = useState('inbox');
  const [of, setOf] = useState({ cat: '全部', country: '全部', status: '全部', q: '' });
  const [nav, setNav] = useState('tx-home');
  const [recId, setRecId] = useState(null);
  const [solCode, setSolCode] = useState(null);
  const [step, setStep] = useState(1);
  const [sf, setSf] = useState({ cat: '全部', dept: '全部', q: '' });
  const [menuOpen, setMenuOpen] = useState(false);
  const [rq, setRq] = useState(''); const [rst, setRst] = useState('全部');
  const [contact, setContact] = useState(null); // { recId } 或 { sol }
  const mobile = useMobile();
  const scroller = useRef(null);

  useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify({ records, draft, trial, opps, profile })); } catch (e) {} }, [records, draft, trial, opps, profile]);
  useEffect(() => { if (scroller.current) scroller.current.scrollTop = 0; window.scrollTo(0, 0); }, [nav, recId, solCode, oppId]);

  const go = (k) => { setNav(k); setRecId(null); setSolCode(null); setOppId(null); setMenuOpen(false); };
  const openOpp = (id, from) => { setNav(from === 'deals' ? 'pt-deals' : from === 'stats' ? 'pt-stats' : 'pt-inbox'); setOppFrom(from); setOppId(id); };
  const openRecord = (id) => { setNav('tx-records'); setRecId(id); setSolCode(null); };
  const patchRec = (id, patch) => setRecords((rs) => rs.map((r) => r.id === id ? { ...r, ...patch } : r));
  const rec = recId ? records.find((r) => r.id === recId) : null;
  const patchOpp = (id, patch) => setOpps((os) => os.map((o) => o.id === id ? { ...o, ...patch, updated: todayStr() } : o));
  const curOpp = oppId ? opps.find((o) => o.id === oppId) : null;
  const partnerReply = (o, reply) => {
    patchOpp(o.id, { stage: reply.interest ? 'confirming' : 'declined', reply, repliedAt: Date.now() });
    toast(reply.interest ? '已送出回覆，平台會向客戶確認' : '已記錄為沒興趣');
  };
  const partnerAdvance = (o, stage) => {
    patchOpp(o.id, stage === 'won' ? { stage, settle: 'pending', wonDate: todayStr() } : { stage });
    toast('商機進度已更新為「' + DM.OSTATUS[stage].label + '」');
  };

  const generate = () => {
    const n = records.reduce((m, r) => Math.max(m, parseInt(r.id.slice(-3), 10) || 0), 0) + 1;
    const d = new Date(), pad = (x) => String(x).padStart(2, '0');
    const r = { id: 'EV-2026-' + String(n).padStart(3, '0'), date: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),
      status: draft.consent ? 'seeking' : 'done', scope: '全公司', base: null, demo: false, answers: JSON.parse(JSON.stringify(draft)) };
    setRecords([r, ...records]);
    openRecord(r.id);
    toast('評估報告已產生，已存入「我的評估」');
  };
  const useMyNumbers = (s) => {
    const a = JSON.parse(JSON.stringify(draft));
    if (s.item) { a.on[s.item] = true; toast('已勾選對應題目，請填入您的數字'); }
    else {
      const line = '想評估：' + s.title + '（' + s.sol + '）';
      if ((a.extra || '').indexOf(line) < 0) a.extra = (a.extra ? a.extra + '\n' : '') + line;
      toast('已帶入 Q14，顧問會在陪同評估時一併檢視');
    }
    setDraft(a); setStep(s.item ? 3 : 3); go('tx-assess');
  };
  const redo = (r) => { setDraft(JSON.parse(JSON.stringify(r.answers))); setStep(1); go('tx-assess'); toast('已帶入這份評估的作答，可修改後重新產生'); };
  const submitContact = (info) => {
    if (contact && contact.recId) {
      const r = records.find((x) => x.id === contact.recId);
      patchRec(r.id, { status: 'advisor', base: r.status === 'advisor' ? r.base : r.status, contact: info });
    }
    setContact(null);
    toast('已送出，顧問將於 2 個工作天內聯繫您');
  };
  const simReply = () => {
    const r = records.find((x) => x.status === 'seeking' || x.status === 'advisor');
    if (!r) { toast('目前沒有「尋找合適方案中」或「顧問聯繫中」的評估，請先在自評勾選同意媒合'); return; }
    const an = analyze(r.answers), top = an.top[0] || an.items[0], w = r.answers.timeline;
    patchRec(r.id, { status: 'proposal', proposal: { approach: '先盤點現有流程與資料，從「' + top.p.name + '」開始小範圍上線，穩定後再擴大到其他單位。', timeline: w === '3 個月內' ? '1–3 個月' : w === '6–12 個月' ? '3–6 個月' : '1–3 個月' } });
    toast(r.id + ' 已有合適方案，狀態變為「有方案待您確認」');
  };
  const simAgree = () => {
    const c = opps.filter((o) => o.stage === 'confirming').sort((a, b) => (b.repliedAt || 0) - (a.repliedAt || 0) || b.id.localeCompare(a.id))[0];
    if (!c) { toast('目前沒有等待客戶確認的商機'); return; }
    const d = DM.DEMO_CLIENTS[parseInt(c.id.slice(-4), 10) % DM.DEMO_CLIENTS.length];
    patchOpp(c.id, { stage: 'agreed', reveal: { company: d[0], contact: d[1], phone: '02-1234-5678（示範）' } });
    toast(c.id + ' 客戶已同意，已揭露客戶身分');
  };
  const resetAll = () => {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    setRecords(DM.demoRecords()); setDraft(DM.blankAnswers()); setTrial(DM.trialDefaults()); setOpps(DM.seedOpps()); setProfile(DM.seedProfile()); setOf({ cat: '全部', country: '全部', status: '全部', q: '' }); setSf({ cat: '全部', dept: '全部', q: '' }); setRq(''); setRst('全部'); setStep(1);
    go('tx-home'); toast('已重設為示範資料');
  };

  const base = ['總會服務', '找數位轉型'];
  const names = { 'tx-home': '總覽', 'tx-assess': '機會點自評', 'tx-solutions': '解決方案', 'tx-trial': '效益試算', 'tx-records': '我的評估' };
  let crumbs;
  const pnames = { 'pt-inbox': '收到的合作機會', 'pt-deals': '我的商機', 'pt-profile': '服務能力檔案', 'pt-stats': '成效與結算' };
  if (nav.indexOf('pt-') === 0) { crumbs = ['我的', pnames[nav]]; if (oppId) crumbs.push(oppId); }
  else if (nav.indexOf('out:') === 0) crumbs = ['SENSE', nav.slice(4)];
  else { crumbs = [...base, names[nav]]; if (solCode) crumbs.push(solCode); if (recId) crumbs.push(recId); }

  let screen;
  if (nav.indexOf('pt-') === 0) {
    if (curOpp) screen = <OppDetail key={curOpp.id} o={curOpp} profile={profile} back={oppFrom} onBack={() => setOppId(null)} onReply={(rp) => partnerReply(curOpp, rp)} onAdvance={(st) => partnerAdvance(curOpp, st)} />;
    else if (nav === 'pt-inbox') screen = <InboxPage opps={opps} profile={profile} onOpen={(id) => openOpp(id, 'inbox')} f={of} setF={setOf} />;
    else if (nav === 'pt-deals') screen = <DealsPage opps={opps} onOpen={(id) => openOpp(id, 'deals')} />;
    else if (nav === 'pt-profile') screen = <ProfilePage key={JSON.stringify(profile).length} profile={profile} setProfile={setProfile} />;
    else screen = <StatsPage opps={opps} onOpen={(id) => openOpp(id, 'stats')} />;
  }
  else if (nav.indexOf('out:') === 0) screen = <OutOfScope name={nav.slice(4)} onBack={() => go('tx-home')} />;
  else if (nav === 'tx-home') screen = <HomePage records={records} go={go} openRecord={openRecord} />;
  else if (nav === 'tx-assess') screen = <AssessPage A={draft} setA={setDraft} step={step} setStep={setStep} onGenerate={generate} go={go} />;
  else if (nav === 'tx-solutions') screen = solCode
    ? <SolutionDetail code={solCode} onBack={() => setSolCode(null)} onUse={useMyNumbers} go={go}
        onContact={(s) => setContact({ sol: s })} />
    : <SolutionsPage f={sf} setF={setSf} onOpen={setSolCode} />;
  else if (nav === 'tx-trial') screen = <TrialPage T={trial} setT={setTrial} go={go} />;
  else if (nav === 'tx-records') screen = rec
    ? <ReportPage rec={rec} onBack={() => setRecId(null)} onContact={() => (rec.status === 'advisor' || rec.contact) ? toast('您已送出聯繫需求，顧問將於 2 個工作天內聯繫您') : setContact({ recId: rec.id })}
        onAgree={() => { patchRec(rec.id, { status: 'scheduled' }); toast('已通知顧問安排洽談，將與您確認時間'); }}
        onDecline={() => { patchRec(rec.id, { status: 'done' }); toast('已記錄，暫不安排洽談；之後有需要可再請顧問聯繫'); }}
        onRedo={() => redo(rec)} />
    : <RecordsPage records={records} onOpen={openRecord} go={go} q={rq} setQ={setRq} st={rst} setSt={setRst} />;

  return (
    <div style={{ display: 'flex', flexDirection: mobile ? 'column' : 'row', width: '100%', height: '100%', minWidth: 0 }}>
      <Sidebar mobile={mobile} open={menuOpen} setOpen={setMenuOpen} active={nav} onNavigate={go} onReset={resetAll} pending={opps.filter((o) => o.stage === 'pushed' && !isOverdue(o)).length} />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', minWidth: 0, minHeight: 0 }}>
        {!mobile && <Header crumbs={crumbs} />}
        <div ref={scroller} style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden', background: '#FAFCFF', minWidth: 0 }}>{screen}</div>
      </div>
      <button type="button" aria-label="示範設定" onClick={() => setDemoOpen(!demoOpen)} style={{ position: 'fixed', right: 14, bottom: 14, width: 34, height: 34, borderRadius: 17, border: '1px solid #E3E3E3', background: '#fff', color: '#999', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', zIndex: 60, boxShadow: '0 2px 8px rgba(0,0,0,.08)' }}><Icon name="gear" size={16} /></button>
      {demoOpen && (
        <div role="dialog" aria-label="示範設定" style={{ position: 'fixed', right: 14, bottom: 56, width: 300, maxWidth: 'calc(100vw - 28px)', background: '#fff', border: '1px solid #E3E3E3', borderRadius: 8, boxShadow: '0 10px 30px rgba(35,55,128,.18)', padding: 16, zIndex: 60 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}><b style={{ fontWeight: 500 }}>示範設定</b><button type="button" aria-label="關閉示範設定" onClick={() => setDemoOpen(false)} style={{ border: 0, background: 'none', color: '#999', fontSize: 20, cursor: 'pointer', lineHeight: 1 }}>×</button></div>
          <div style={{ fontSize: 12, color: '#999', lineHeight: 1.6, marginBottom: 12 }}>用來示範平台上其他企業的動作，讓兩邊的畫面連動。</div>
          <div style={{ display: 'grid', gap: 8 }}>
            <Button variant="secondary" block onClick={simReply}>模擬合作夥伴回覆最新一筆評估</Button>
            <Button variant="secondary" block onClick={simAgree}>模擬客戶同意最新一筆有興趣的商機</Button>
          </div>
        </div>
      )}
      <ContactModal open={!!contact} onClose={() => setContact(null)} onSubmit={submitContact}
        context={contact && contact.sol ? '關於「' + contact.sol.title + '」，顧問會說明適合的做法與評估方式。' : '顧問會依這份評估報告與您聯繫。'} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
